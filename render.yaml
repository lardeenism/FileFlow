services:
  - type: web
    name: fileflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: FILEFLOW_SECRET_KEY
        generateValue: true
      - key: FILEFLOW_STORAGE_ROOT
        value: /tmp/fileflow
